<aside class="sidebar">
  <a class="brand" routerLink="/clientes"
    ><span class="brand-mark" aria-hidden="true">L.</span
    ><span>Locadora<span class="brand-sub">DE LIVROS</span></span></a
  >
  <span class="nav-label">SEU ESPAÇO</span>
  <nav aria-label="Navegação principal">
    <a
      class="nav-link"
      routerLink="/clientes"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <circle cx="9" cy="8" r="3" />
        <path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v3" /></svg
      >Clientes<span class="nav-dot" aria-hidden="true"></span
    ></a>
    <a
      class="nav-link"
      routerLink="/catalogo"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      Catálogo <span class="nav-dot" aria-hidden="true"></span>
    </a>
  </nav>
  <div class="sidebar-note">
    <span class="note-line" aria-hidden="true"></span>
    <p>Boas leituras começam<br />com boas conexões.</p>
    <span>PAINEL DA LOCADORA</span>
  </div>
  <div class="operator">
    <div class="operator-avatar" aria-hidden="true">
      {{ auth.usuario().slice(0, 1).toUpperCase() }}
    </div>
    <div>
      <strong>{{ auth.usuario() }}</strong><span>Operador</span>
    </div>
    <button
      type="button"
      class="exit-button"
      (click)="auth.sair()"
      aria-label="Sair da locadora"
      title="Sair"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <path d="M9 5H4v14h5m5-14 7 7-7 7m-5-7h12" />
      </svg>
    </button>
  </div>
</aside>
