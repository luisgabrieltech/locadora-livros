<aside class="sidebar">
  <a class="brand" routerLink="/clientes">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>Locadora de livros</span>
  </a>
  <nav aria-label="Navegação principal">
    <a
      class="nav-link"
      routerLink="/clientes"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Clientes</a
    >
    <a
      class="nav-link"
      routerLink="/catalogo"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Catálogo</a
    >
  </nav>
  <div class="operator">
    <div class="operator-details">
      <strong>{{ auth.usuario() }}</strong>
      <span>Operador</span>
    </div>
    <button type="button" class="exit-button" (click)="auth.sair()" aria-label="Sair da locadora">
      Sair
    </button>
  </div>
</aside>
