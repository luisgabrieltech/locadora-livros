name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Java 22 e cache Maven
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Configurar Node.js e cache npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        run: npm ci --prefix frontend

      - name: Verificar formatacao do frontend
        run: npm --prefix frontend run format:check

      - name: Executar testes do frontend
        run: npm --prefix frontend test

      - name: Gerar build do frontend
        run: npm --prefix frontend run build

      - name: Verificar Docker para Testcontainers
        run: docker info

      - name: Compilar e executar testes unitarios e de integracao
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Disponibilizar relatorios em caso de falha
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
